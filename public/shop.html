<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f7f4">
<title>全部商品 · 云端积分商店</title>
<link rel="stylesheet" href="/storefront.css">
</head>
<body>
<header class="site-header">
  <div class="container">
    <a class="brand" href="/"><span class="brand-mark">✳</span><span data-site-name>云端积分商店</span></a>
    <nav class="nav-links" aria-label="主导航">
      <a class="nav-link" data-nav="home" href="/">首页</a>
      <a class="nav-link" data-nav="shop" href="/shop">全部商品</a>
      <a class="nav-link" data-nav="account" href="/account">个人中心</a>
    </nav>
    <div class="header-side">
      <span class="points-chip hidden" data-points-wrap><b data-points>0</b><span>积分</span></span>
      <a class="account-link" href="/account"><span class="account-dot" data-account-dot>→</span><span data-account-label>登录 / 注册</span></a>
    </div>
  </div>
</header>

<main>
  <section class="container page-head">
    <div class="eyebrow">CATALOG</div>
    <h1>商品目录</h1>
    <p>按分类、子分类与标签筛选。兑换后的内容会立即展示，并永久保存在个人中心。</p>
  </section>

  <div class="container shop-layout">
    <aside class="filters" aria-label="商品筛选">
      <div class="filter-group">
        <div class="filter-title">分类</div>
        <div id="categoryFilters"><div class="notice-line">正在读取分类…</div></div>
      </div>
      <div class="filter-group">
        <div class="filter-title">标签</div>
        <div class="tag-cloud" id="tagFilters"><span class="notice-line">正在读取标签…</span></div>
      </div>
    </aside>

    <section class="shop-main">
      <div class="shop-toolbar">
        <label class="searchbox">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.4-3.4"></path></svg>
          <input id="searchInput" type="search" placeholder="搜索商品名称或简介" autocomplete="off">
        </label>
        <select class="selectbox" id="sortSelect" aria-label="商品排序">
          <option value="recommended">推荐排序</option>
          <option value="price-asc">积分从低到高</option>
          <option value="price-desc">积分从高到低</option>
          <option value="newest">最新上架</option>
        </select>
      </div>
      <div class="toolbar-note">
        <span id="resultCount">正在加载商品…</span>
        <div class="active-filters" id="activeFilters"></div>
      </div>
      <div class="product-grid" id="productGrid" style="margin-top:14px"><div class="empty-state">正在加载商品…</div></div>
    </section>
  </div>
</main>

<footer class="site-footer">
  <div class="container">
    <span>© <span id="year"></span> <span data-site-name>云端积分商店</span></span>
    <a href="/account" style="color:var(--muted)">个人中心 · 充值积分</a>
  </div>
</footer>

<div class="modal" id="deliveryModal" role="dialog" aria-modal="true" aria-labelledby="deliveryTitle">
  <div class="modal-dialog">
    <button class="modal-close" aria-label="关闭" onclick="Store.setModal('#deliveryModal', false)">×</button>
    <h2 id="deliveryTitle">兑换成功</h2>
    <p id="deliverySub">内容已保存到「我的已购」。</p>
    <div id="deliveryBody"></div>
  </div>
</div>

<script src="/storefront.js"></script>
<script>
const { $, $$, esc, api, toast, withBusy, setModal, initChrome, setPoints, deliveryHtml, query } = Store;
let me = null, points = null, products = [], categories = [];
const params = query();
const state = {
  category: params.get('category') || '',
  tag: params.get('tag') || '',
  q: params.get('q') || '',
  sort: 'recommended'
};

const categoryById = id => categories.find(item => item.id === id);
const categoryLabel = id => categoryById(id)?.name || '未分类';
const childIds = id => {
  const ids = [id];
  for (let i = 0; i < ids.length; i++) {
    categories.filter(item => item.parent_id === ids[i]).forEach(item => {
      if (!ids.includes(item.id)) ids.push(item.id);
    });
  }
  return ids;
};
const productCountFor = id => {
  const ids = new Set(childIds(id));
  return products.filter(item => ids.has(item.category_id)).length;
};

function syncUrl() {
  const next = new URLSearchParams();
  if (state.category) next.set('category', state.category);
  if (state.tag) next.set('tag', state.tag);
  if (state.q) next.set('q', state.q);
  history.replaceState(null, '', next.toString() ? `/shop?${next}` : '/shop');
}

function renderCategoryFilters() {
  const tops = categories.filter(item => !item.parent_id);
  const parts = [`<button class="filter-btn ${!state.category ? 'active' : ''}" data-category=""><span>全部商品</span><span class="count">${products.length}</span></button>`];
  for (const top of tops) {
    const children = categories.filter(item => item.parent_id === top.id);
    parts.push(`<button class="filter-btn ${state.category === top.id ? 'active' : ''}" data-category="${esc(top.id)}"><span>${esc(top.name)}</span><span class="count">${productCountFor(top.id)}</span></button>`);
    if (children.length) {
      parts.push(`<div class="filter-children">${children.map(child =>
        `<button class="filter-child ${state.category === child.id ? 'active' : ''}" data-category="${esc(child.id)}">${esc(child.name)}</button>`
      ).join('')}</div>`);
    }
  }
  $('#categoryFilters').innerHTML = parts.join('');
}

function renderTagFilters() {
  const counts = new Map();
  products.forEach(product => (product.tags || []).forEach(tag => counts.set(tag, (counts.get(tag) || 0) + 1)));
  const tags = [...counts.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], 'zh-CN'));
  $('#tagFilters').innerHTML = tags.length
    ? tags.map(([tag, count]) => `<button class="tag-btn ${state.tag === tag ? 'active' : ''}" data-tag="${esc(tag)}">${esc(tag)} <span style="opacity:.6">${count}</span></button>`).join('')
    : '<span class="notice-line">暂无标签</span>';
}

function filteredProducts() {
  let list = products.slice();
  if (state.category) {
    const ids = new Set(childIds(state.category));
    list = list.filter(item => ids.has(item.category_id));
  }
  if (state.tag) list = list.filter(item => (item.tags || []).includes(state.tag));
  if (state.q) {
    const q = state.q.toLowerCase();
    list = list.filter(item => [item.title, item.summary, ...(item.tags || [])].join(' ').toLowerCase().includes(q));
  }
  if (state.sort === 'price-asc') list.sort((a, b) => Number(a.price_points) - Number(b.price_points));
  if (state.sort === 'price-desc') list.sort((a, b) => Number(b.price_points) - Number(a.price_points));
  if (state.sort === 'newest') list.sort((a, b) => String(b.created_at).localeCompare(String(a.created_at)));
  return list;
}

function renderProducts() {
  const list = filteredProducts();
  const active = [];
  if (state.category) active.push(`<span class="filter-chip">${esc(categoryLabel(state.category))}<button data-clear="category" aria-label="清除分类">×</button></span>`);
  if (state.tag) active.push(`<span class="filter-chip"># ${esc(state.tag)}<button data-clear="tag" aria-label="清除标签">×</button></span>`);
  if (state.q) active.push(`<span class="filter-chip">搜索：${esc(state.q)}<button data-clear="q" aria-label="清除搜索">×</button></span>`);
  if (active.length > 1) active.push('<button class="filter-chip" data-clear="all">清除全部</button>');
  $('#activeFilters').innerHTML = active.join('');
  $('#resultCount').textContent = `共 ${list.length} 件商品`;
  if (!list.length) {
    $('#productGrid').innerHTML = '<div class="empty-state"><b>没有匹配的商品</b>换个分类或标签试试，也可以清除当前筛选。<div class="actions" style="justify-content:center;margin-top:14px"><button class="sbtn sm" data-clear="all">清除筛选</button></div></div>';
    return;
  }
  $('#productGrid').innerHTML = list.map((product, index) => {
    const soldOut = product.stock !== null && product.stock !== undefined && Number(product.stock) <= 0;
    const enough = points === null ? null : Number(points) >= Number(product.price_points);
    const label = soldOut ? '已售罄' : (!me ? '登录后兑换' : (enough === false ? '积分不足' : '立即兑换'));
    const category = categoryLabel(product.category_id);
    const cover = product.cover_url
      ? `<div class="product-cover tone-${index % 4}"><img src="${esc(product.cover_url)}" alt="" loading="lazy"><span class="cover-badge">${esc(product.delivery_label || '数字交付')}</span></div>`
      : `<div class="product-cover tone-${index % 4}"><span>${esc((category === '未分类' ? product.title : category).slice(0, 1))}</span><span class="cover-badge">${esc(product.delivery_label || '数字交付')}</span></div>`;
    return `<article class="product-card">
      ${cover}
      <div class="product-body">
        <div class="product-cat">${esc(category)}</div>
        <h3>${esc(product.title)}</h3>
        <p class="summary">${esc(product.summary || '')}</p>
        <div class="product-tags">${(product.tags || []).slice(0, 4).map(tag => `<button class="product-tag" data-tag="${esc(tag)}">${esc(tag)}</button>`).join('')}</div>
        <div class="product-footer">
          <div><div class="price">${Number(product.price_points)} <small>积分</small></div><div class="stock-note">${product.stock === null || product.stock === undefined ? '不限量' : soldOut ? '已售罄' : '剩余 ' + Number(product.stock)}</div></div>
          <button class="sbtn sm ${enough === false ? '' : 'primary'}" ${soldOut ? 'disabled' : ''} onclick="buyProduct('${esc(product.id)}', this)">${label}</button>
        </div>
      </div>
    </article>`;
  }).join('');
}

function applyState() {
  renderCategoryFilters();
  renderTagFilters();
  renderProducts();
  syncUrl();
}

async function loadData(button) {
  return withBusy(button, async () => {
    try {
      const [categoryData, productData] = await Promise.all([api('/api/categories'), api('/api/products')]);
      categories = categoryData.items || [];
      products = productData.items || [];
      applyState();
    } catch (error) {
      $('#productGrid').innerHTML = `<div class="empty-state"><b>商品读取失败</b>${esc(error.message)}</div>`;
      $('#resultCount').textContent = '读取失败';
    }
  });
}

async function loadAccess() {
  if (!me) return;
  try {
    const data = await api('/api/access');
    points = data.requires_consumption ? Number(data.remaining ?? 0) : null;
    setPoints(points);
  } catch {}
}

async function buyProduct(id, button) {
  if (!me) {
    location.href = '/account?next=' + encodeURIComponent(location.pathname + location.search);
    return;
  }
  const product = products.find(item => item.id === id);
  if (!product) return;
  if (points !== null && points < Number(product.price_points)) {
    toast('积分不足，请先在个人中心充值');
    setTimeout(() => { location.href = '/account?tab=recharge'; }, 600);
    return;
  }
  if (!confirm(`用 ${product.price_points} 积分兑换「${product.title}」？\n兑换后积分立即扣减，内容会保存到「我的已购」。`)) return;
  return withBusy(button, async () => {
    try {
      const result = await api(`/api/products/${encodeURIComponent(id)}/purchase`, {
        method: 'POST',
        body: JSON.stringify({ idempotency_key: 'ord-' + crypto.randomUUID() })
      });
      if (result.delivery) {
        $('#deliveryTitle').textContent = '兑换成功 · ' + (result.order?.title || '');
        $('#deliverySub').textContent = `已扣减 ${result.order?.price_points ?? ''} 积分，订单号 ${result.order?.order_no || ''}`;
        $('#deliveryBody').innerHTML = deliveryHtml(result.delivery) || '<div class="notice-line">该商品暂无交付内容，请联系管理员。</div>';
        setModal('#deliveryModal', true, '.modal-close');
      } else {
        toast(result.message || '扣减结果待确认，请稍后在个人中心同步');
      }
      await loadAccess();
      await loadData();
    } catch (error) {
      toast(error.message);
    }
  });
}

$('#categoryFilters').addEventListener('click', event => {
  const button = event.target.closest('[data-category]');
  if (!button) return;
  state.category = button.dataset.category || '';
  applyState();
});
$('#tagFilters').addEventListener('click', event => {
  const button = event.target.closest('[data-tag]');
  if (!button) return;
  state.tag = state.tag === button.dataset.tag ? '' : button.dataset.tag;
  applyState();
});
$('#productGrid').addEventListener('click', event => {
  const tag = event.target.closest('[data-tag]');
  if (tag) { state.tag = tag.dataset.tag; applyState(); }
});
$('#activeFilters').addEventListener('click', event => {
  const button = event.target.closest('[data-clear]');
  if (!button) return;
  const target = button.dataset.clear;
  if (target === 'all' || target === 'category') state.category = '';
  if (target === 'all' || target === 'tag') state.tag = '';
  if (target === 'all' || target === 'q') { state.q = ''; $('#searchInput').value = ''; }
  applyState();
});
let searchTimer;
$('#searchInput').addEventListener('input', event => {
  state.q = event.target.value.trim();
  clearTimeout(searchTimer);
  searchTimer = setTimeout(applyState, 160);
});
$('#sortSelect').addEventListener('change', event => {
  state.sort = event.target.value;
  renderProducts();
});
$('#searchInput').value = state.q;
$('#year').textContent = new Date().getFullYear();

(async () => {
  const chrome = await initChrome('shop');
  me = chrome.me;
  await loadAccess();
  await loadData();
})();
</script>
</body>
</html>
